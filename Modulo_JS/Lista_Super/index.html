<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Supermercado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>App Lista de Supermercado</h2>
    </header>

    <div class="lista-cadastro">
        <input type="text" placeholder="Digite o nome do item" id="item-input" name="item-input">
        <input type="text" placeholder="Digite o valor do item" id="valor-input" name="valor-input">
        <input type="submit" value="Adicionar" id="adicionar-btn">
    </div>

    <div class="lista-itens">
        <h3>Lista de Itens</h3>
        
    </div>

    <div class="soma-produto">
        <h1>Total: R$0</h1>
    </div>

    <button name="limpar" id="limpar">Limpar</button>
    <script src="script.js"></script>
</body>
</html>
