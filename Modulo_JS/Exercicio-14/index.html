<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
        position: relative;
        height: 500px;
        text-align: center;
        width: 100vw; /* Garante largura total */
        }   

        .container img {
            position: absolute;
            left: 50%;
            top: 50%;
            opacity: 0;
            transform: translate(-50%, -50%);
            transition: opacity 1s;
        }

        .bullets{
            text-align: center;
        }

        .bullet-single {
            margin: 0 8px;
            cursor: pointer;
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 10px;
            background-color: #ccc;
        }

        .active-bullet {
            background-color: #333;
        }

    </style>
</head>
    <body>
        <div class="container">
            <img style="opacity: 1;" src="https://picsum.photos/id/237/300/200" alt="Imagem aleatória 1">
            <img src="https://picsum.photos/id/238/300/200" alt="Imagem aleatória 2">
            <img src="https://picsum.photos/id/239/300/200" alt="Imagem aleatória 3">
        </div>

        <div class="bullets">
            <div class="bullet-single active-bullet"></div>
            <div class="bullet-single"></div>
            <div class="bullet-single"></div>
        </div>

        <script>
            var lastIndex = 0;
            var images = document.querySelectorAll('.container img');
            var bullets = document.querySelectorAll('.bullet-single');

            bullets.forEach((bullet, index) => {
                bullet.addEventListener('click', () => {
                    // Troca imagem
                    images[lastIndex].style.opacity = '0';
                    images[index].style.opacity = '1';

                    // Troca bullet ativo
                    bullets[lastIndex].classList.remove('active-bullet');
                    bullets[index].classList.add('active-bullet');

                    lastIndex = index;
                });
            });
        </script>
    </body>
</html>
